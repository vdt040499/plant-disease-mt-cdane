<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1216 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cdane-mt-title cdane-mt-desc">
          <title id="cdane-mt-title">CDAN+E plus Mean Teacher training pipeline</title>
          <desc id="cdane-mt-desc">The same CDAN+E pipeline, but each target image yields three views: the un-augmented view feeds the adversarial branch unchanged, while two augmented views feed the student and the EMA teacher; the disagreement between their predictions forms L_cons.</desc>
          <defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap');</style>
            <marker id="arrow-2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
              <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
            </marker>
            <marker id="arrow-accent-2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
              <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
            </marker>
          </defs>

          <rect width="100%" height="100%" fill="#f5f5f5"/>

          <!-- ── ARROWS ── -->
          <!-- SRC → phi -->
          <path d="M 168,120 H 192 Q 200,120 200,128 V 184 Q 200,192 208,192 H 248" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-2)"/>
          <!-- plain → phi -->
          <path d="M 168,328 H 176 Q 184,328 184,320 V 216 Q 184,208 192,208 H 248" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-2)"/>
          <!-- v1 → phi (student) -->
          <path d="M 168,352 H 208 Q 216,352 216,344 V 232 Q 216,224 224,224 H 248" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-2)"/>
          <!-- v2 → teacher -->
          <line x1="168" y1="376" x2="248" y2="376" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-2)"/>
          <!-- phi → G -->
          <line x1="384" y1="208" x2="464" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-2)"/>
          <!-- G → khối CDAN -->
          <line x1="600" y1="208" x2="648" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-2)"/>
          <!-- khối CDAN → L_cdan -->
          <line x1="880" y1="208" x2="1080" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-2)"/>
          <!-- G → L_cls -->
          <path d="M 532,176 V 128 Q 532,120 540,120 H 1080" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-2)"/>
          <rect x="772" y="100" width="76" height="12" rx="2" fill="#f5f5f5"/>
          <text x="810" y="109" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CE · SOURCE</text>
          <!-- G (student logits) → L_cons -->
          <path d="M 532,240 V 360 Q 532,368 540,368 H 1080" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-2)"/>
          <rect x="756" y="348" width="88" height="12" rx="2" fill="#f5f5f5"/>
          <text x="800" y="357" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STUDENT · V1</text>
          <!-- teacher → L_cons -->
          <line x1="448" y1="408" x2="1080" y2="408" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent-2)"/>
          <rect x="756" y="388" width="88" height="12" rx="2" fill="#f5f5f5"/>
          <text x="800" y="397" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TEACHER · V2</text>
          <!-- EMA: student → teacher -->
          <line x1="316" y1="240" x2="316" y2="348" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-accent-2)"/>
          <rect x="324" y="288" width="84" height="12" rx="2" fill="#f5f5f5"/>
          <text x="328" y="297" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">EMA α=0.99</text>

          <!-- ── NODES ── -->
          <!-- SRC -->
          <rect x="32" y="88" width="136" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="32" y="88" width="136" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
          <rect x="40" y="94" width="30" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
          <text x="55" y="103" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SRC</text>
          <text x="100" y="126" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Be Vietnam Pro', sans-serif" text-anchor="middle">Source: PVD + FBR</text>
          <text x="100" y="141" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'Be Vietnam Pro', monospace" text-anchor="middle">labelled · 64/batch</text>

          <!-- 3-VIEW target -->
          <rect x="32" y="304" width="136" height="96" rx="6" fill="#f5f5f5"/>
          <rect x="32" y="304" width="136" height="96" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
          <rect x="40" y="310" width="44" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
          <text x="62" y="319" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">3-VIEW</text>
          <text x="100" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Be Vietnam Pro', sans-serif" text-anchor="middle">Target: PPD</text>
          <text x="100" y="358" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">plain → CDAN+E</text>
          <text x="100" y="372" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">v1 → student</text>
          <text x="100" y="386" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">v2 → teacher</text>

          <!-- phi student -->
          <rect x="248" y="176" width="136" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="248" y="176" width="136" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <rect x="256" y="182" width="30" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
          <text x="271" y="191" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PHI</text>
          <text x="316" y="214" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Be Vietnam Pro', sans-serif" text-anchor="middle">ResNet-18 φ</text>
          <text x="316" y="229" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">student · 512-d</text>

          <!-- G student -->
          <rect x="464" y="176" width="136" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="464" y="176" width="136" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <rect x="472" y="182" width="30" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
          <text x="487" y="191" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLS</text>
          <text x="532" y="214" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Be Vietnam Pro', sans-serif" text-anchor="middle">Classifier G</text>
          <text x="532" y="229" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">student · 512 → 3</text>

          <!-- khối CDAN gộp -->
          <rect x="648" y="176" width="232" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="648" y="176" width="232" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
          <rect x="656" y="182" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
          <text x="678" y="191" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CDAN+E</text>
          <text x="764" y="214" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Be Vietnam Pro', sans-serif" text-anchor="middle">Adversarial Branch</text>
          <text x="764" y="229" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'Be Vietnam Pro', monospace" text-anchor="middle">f ⊗ p → GRL → D  (detailed in figure 1)</text>

          <!-- TEACHER (FOCAL, mới) -->
          <rect x="248" y="348" width="200" height="80" rx="6" fill="#f5f5f5"/>
          <rect x="248" y="348" width="200" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
          <rect x="256" y="354" width="30" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
          <text x="271" y="363" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">+MT</text>
          <text x="348" y="386" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Be Vietnam Pro', sans-serif" text-anchor="middle">Teacher (EMA)</text>
          <text x="348" y="402" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'Be Vietnam Pro', monospace" text-anchor="middle">φ_t , G_t · gradients frozen</text>
          <text x="348" y="416" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">θ_t ← α θ_t + (1−α) θ_s</text>

          <!-- L_cls -->
          <rect x="1080" y="88" width="104" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="1080" y="88" width="104" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
          <rect x="1088" y="94" width="34" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
          <text x="1105" y="103" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOSS</text>
          <text x="1132" y="126" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">L_cls</text>
          <text x="1132" y="141" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'Be Vietnam Pro', monospace" text-anchor="middle">CE, source</text>

          <!-- L_cdan -->
          <rect x="1080" y="176" width="104" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="1080" y="176" width="104" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
          <rect x="1088" y="182" width="34" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
          <text x="1105" y="191" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOSS</text>
          <text x="1132" y="214" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">L_cdan</text>
          <text x="1132" y="229" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'Be Vietnam Pro', monospace" text-anchor="middle">domain CE · +E</text>

          <!-- L_cons (FOCAL, mới) -->
          <rect x="1080" y="348" width="104" height="80" rx="6" fill="#f5f5f5"/>
          <rect x="1080" y="348" width="104" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
          <rect x="1088" y="354" width="30" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
          <text x="1103" y="363" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">+MT</text>
          <text x="1132" y="386" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">L_cons</text>
          <text x="1132" y="402" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">softmax-MSE</text>
          <text x="1132" y="416" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">× w(t) : 0 → 9</text>

          <!-- ── LEGEND ── -->
          <line x1="32" y1="472" x2="1184" y2="472" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
          <text x="32" y="488" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
          <rect x="128" y="478" width="20" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
          <text x="156" y="488" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Be Vietnam Pro', monospace">Parametric module</text>
          <rect x="376" y="478" width="20" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.8"/>
          <text x="404" y="488" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Be Vietnam Pro', monospace">Mean Teacher</text>
          <line x1="656" y1="484" x2="676" y2="484" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="5,4"/>
          <text x="684" y="488" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Be Vietnam Pro', monospace">EMA update · no backprop</text>
          <rect x="976" y="478" width="20" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
          <text x="1004" y="488" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Be Vietnam Pro', monospace">Collapsed block</text>
        </svg>
